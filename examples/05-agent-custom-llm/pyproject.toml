[project]
name = "agent-custom-llm"
version = "0.1.0"
description = "Fish agent + your own 'game master' LLM server (example 05)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
